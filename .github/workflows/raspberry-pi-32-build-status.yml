name: Raspberry Pi 32-bit Build Status

on:
  workflow_run:
    workflows: ["CMake Cross-Platform Build"]
    types: [completed]

permissions:
  actions: read

jobs:
  status:
    uses: ./.github/workflows/platform-build-status.yml
    with:
      job-name: "Build (raspberry-pi-32)"
    permissions:
      actions: read
